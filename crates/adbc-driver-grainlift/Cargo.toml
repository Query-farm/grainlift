[package]
name = "adbc-driver-grainlift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "ADBC client driver for connecting to the Grainlift service"
readme = "../../README.md"

[lib]
# staticlib: linked into hosts that cannot load drivers dynamically (the
# grainlift DuckDB extension, including its DuckDB-WASM build).
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["reqwest-http", "tls-tcp", "iroh", "oauth-login"]
# HTTP(S) endpoints through reqwest (blocking).
reqwest-http = ["dep:reqwest", "dep:rustls", "vgi-rpc-client/reqwest"]
# Interactive OAuth sign-in (browser PKCE or device flow) for native clients.
oauth-login = ["dep:base64", "dep:rand", "dep:sha2"]
# HTTP(S) endpoints through an executor registered by the host application
# (see host_http.rs). Used by the DuckDB extension on every platform.
host-http = []
# Persistent VGI byte-stream sessions (tcp://; the base for tls+tcp and iroh).
byte-transports = []
# tls+tcp:// endpoints (mTLS).
tls-tcp = ["byte-transports", "dep:rustls", "vgi-rpc-client/tcp-tls"]
# iroh:// endpoints through a native Iroh endpoint.
iroh = ["byte-transports", "dep:iroh", "dep:tokio", "dep:vgi-rpc-iroh"]
# iroh:// endpoints inside Haybarn DuckDB-WASM (COI), through the page's Iroh
# adapter Worker and SharedArrayBuffer rings (see sab_transport.rs).
iroh-browser = ["byte-transports"]

[dependencies]
grainlift-protocol = { version = "0.4.3", path = "../grainlift-protocol" }
adbc_core.workspace = true
adbc_ffi.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true
iroh = { workspace = true, optional = true }
vgi-rpc-client.workspace = true
vgi-rpc-iroh = { workspace = true, optional = true }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
