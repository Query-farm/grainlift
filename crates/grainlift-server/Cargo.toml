[package]
name = "grainlift-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Grainlift service for server-hosted ADBC drivers"
readme = "../../README.md"

[dependencies]
grainlift-protocol = { version = "0.4.0", path = "../grainlift-protocol" }
adbc_core.workspace = true
adbc_driver_manager.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
axum.workspace = true
clap.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
vgi-rpc = { workspace = true, features = ["http", "jwt-jsonwebtoken", "otel", "tcp-mtls"] }
iroh.workspace = true
vgi-rpc-iroh.workspace = true
tempfile = "3"
hmac = "0.12"
sha2 = "0.10"
rand.workspace = true

[dev-dependencies]
adbc-driver-grainlift = { version = "0.4.0", path = "../adbc-driver-grainlift" }
arrow-array.workspace = true
rcgen = "0.14"
vgi-rpc-client = { workspace = true, features = ["reqwest", "tcp-tls"] }
