[workspace]
resolver = "2"
members = [
    "crates/grainlift-protocol",
    "crates/grainlift-server",
    "crates/adbc-driver-grainlift",
    "validation/synthetic-worker",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
authors = ["Query Farm LLC"]
license = "Apache-2.0"
homepage = "https://query.farm"
repository = "https://github.com/Query-farm/grainlift"

[workspace.dependencies]
adbc_core = { version = "0.25.0", git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
adbc_driver_manager = { version = "0.25.0", git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
adbc_ffi = { version = "0.25.0", git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
arrow-array = "60"
arrow-buffer = "60"
arrow-ipc = "60"
arrow-schema = "60"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Minimal feature sets: the client driver builds for wasm32-unknown-emscripten.
# The server and the native driver transports opt into more in their manifests.
vgi-rpc = { version = "0.28.2", default-features = false, features = ["macros"] }
vgi-rpc-client = { version = "0.28.2", default-features = false, features = ["http"] }
vgi-rpc-iroh = "0.28.2"
