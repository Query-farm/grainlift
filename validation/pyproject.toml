[project]
name = "grainlift-validation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "adbc-driver-manager==1.12.0",
  "pyarrow==25.0.1",
  "pytest==9.1.1",
]

[project.optional-dependencies]
foundry = [
  "adbc-drivers-validation @ git+https://github.com/adbc-drivers/validation.git@3c67c7b9ea9a3e4ab714bad828e373b614c41910",
]

[tool.uv]
# Keep the reviewed Foundry revision and ADBC/PyArrow versions while exercising
# DuckDB 2.0; this revision's transitive constraint still requires DuckDB <2.
override-dependencies = ["duckdb==2.0.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "feature: test for a driver-specific feature",
  "requires_features: test requires declared driver features",
]
xfail_strict = true
junit_family = "legacy"
junit_suite_name = "validation"
junit_duration_report = "call"
