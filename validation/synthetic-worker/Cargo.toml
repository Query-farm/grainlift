# Bounded synthetic worker used by the shared conformance suite and the matched
# Rust/Python benchmarks. It is a validation fixture, not an example to copy.
[package]
name = "grainlift-synthetic-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Bounded synthetic Grainlift worker for conformance and matched ADBC benchmarks"
publish = false

[dependencies]
grainlift-server = { path = "../../crates/grainlift-server" }
adbc_core.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
axum.workspace = true
clap.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
vgi-rpc = { workspace = true, features = ["http", "tcp-mtls"] }
