name: CLI wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested wheels to PyPI (requires the pypi environment and trusted publisher)
        type: boolean
        default: false

# Cancel superseded PR runs; main and manual (publish) runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - run: uvx ruff check python setup.py
      - run: uvx ruff format --check python setup.py
      - run: uvx mypy python/grainlift_adbc_gateway
      - run: uvx pydoclint --config pyproject.toml python/grainlift_adbc_gateway

  wheel:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      # Compiled crates are cached in the GitHub Actions cache and shared by
      # every wheel job and run (and passed into the Linux containers below).
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build portable wheels
        run: uvx 'cibuildwheel>=3,<4' --output-dir dist
        env:
          CIBW_BUILD: cp313-*
          CIBW_SKIP: '*-musllinux* *-win32 *-manylinux_i686'
          CIBW_ARCHS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1 &&
            arch=$(uname -m) &&
            case $arch in
            x86_64) sum=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            aarch64) sum=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
            esac &&
            curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/sccache.tgz "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-$arch-unknown-linux-musl.tar.gz" &&
            echo "$sum  /tmp/sccache.tgz" | sha256sum -c - &&
            tar xzf /tmp/sccache.tgz -C /usr/local/bin --strip-components=1 "sccache-v0.18.0-$arch-unknown-linux-musl/sccache"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.97.1 RUSTC_WRAPPER=sccache'
          CIBW_ENVIRONMENT_PASS_LINUX: SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
      - name: Install and test the platform wheel
        run: |
          cargo build --release --locked -p adbc-driver-grainlift -p grainlift-server
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --no-project --python 3.13 --with "$wheel" --with pytest --with pyarrow python -c '
          import os, pathlib, sys, pytest
          name = {"linux": "libadbc_driver_grainlift.so", "darwin": "libadbc_driver_grainlift.dylib", "win32": "adbc_driver_grainlift.dll"}[sys.platform]
          driver = pathlib.Path("target/release", name).resolve()
          assert driver.is_file(), driver
          os.environ["GRAINLIFT_TEST_DRIVER"] = str(driver)
          raise SystemExit(pytest.main(["python/tests", "-q"]))'
          uvx --from "$wheel" grainlift-adbc-gateway --version
      - name: sccache statistics (host builds)
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-standalone-${{ matrix.target }}
          path: |
            target/release/grainlift-server
            target/release/grainlift-server.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: cli-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
