name: Python ADBC driver wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested driver wheels to PyPI
        type: boolean
        default: false

# Cancel superseded PR runs; main and manual (publish) runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.7
      - run: uvx ruff check packaging/build_driver_context.py packaging/driver
      - run: uvx ruff format --check packaging/build_driver_context.py packaging/driver
      - run: uvx --with adbc-driver-manager mypy --strict packaging/build_driver_context.py packaging/driver/python/adbc_driver_grainlift
      - run: uvx pydoclint --style google packaging/build_driver_context.py packaging/driver/python/adbc_driver_grainlift
      - run: uv run --no-project --python 3.13 python -m unittest discover -s packaging/driver/tests -p 'test_*.py'

  wheel:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
      # Compiled crates are cached in the GitHub Actions cache and shared by
      # every wheel job and run (and passed into the Linux containers below).
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: uv python install 3.13 3.14
      - name: Stage a self-contained driver source distribution
        run: uv run --no-project --python 3.13 python packaging/build_driver_context.py "$RUNNER_TEMP/grainlift-driver-context"
      - name: Build portable driver wheel
        working-directory: ${{ runner.temp }}/grainlift-driver-context
        run: uvx 'cibuildwheel>=3,<4' --output-dir "${{ github.workspace }}/dist-driver"
        env:
          CIBW_BUILD: cp313-*
          CIBW_SKIP: '*-musllinux* *-win32 *-manylinux_i686'
          CIBW_ARCHS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1 &&
            arch=$(uname -m) &&
            case $arch in
            x86_64) sum=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            aarch64) sum=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
            esac &&
            curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/sccache.tgz "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-$arch-unknown-linux-musl.tar.gz" &&
            echo "$sum  /tmp/sccache.tgz" | sha256sum -c - &&
            tar xzf /tmp/sccache.tgz -C /usr/local/bin --strip-components=1 "sccache-v0.18.0-$arch-unknown-linux-musl/sccache"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.97.1 RUSTC_WRAPPER=sccache'
          CIBW_ENVIRONMENT_PASS_LINUX: SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
      - name: Test only the installed driver wheel
        run: |
          cargo build --release --locked -p grainlift-server
          wheel=$(find dist-driver -name '*.whl' -print -quit)
          server="$(pwd)/target/release/grainlift-server"
          if [[ "$RUNNER_OS" == Windows ]]; then server="$(cygpath -w "$server.exe")"; fi
          for python in 3.13 3.14; do
            uv run --no-project --python "$python" --with "$wheel" --with adbc-driver-sqlite --with pyarrow \
              python -I packaging/driver/tests/installed_smoke.py --server "$server"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-wheel-${{ matrix.target }}
          path: dist-driver/*.whl
          if-no-files-found: error
      - name: sccache statistics (host builds)
        if: always()
        run: sccache --show-stats

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi-driver
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: driver-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
