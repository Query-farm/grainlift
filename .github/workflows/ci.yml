name: CI

on:
  # PR branches are covered by pull_request; push only for main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  downstream-e2e:
    name: Real downstream multi-transport end-to-end tests
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
          enable-cache: true
      - run: uv python install 3.13
      - uses: columnar-tech/setup-dbc@ef4bdac93f5792831ebebe3fa2d848a040558caa # v1
        with:
          version: v0.3.0
          drivers: sqlite=1.12.0,duckdb=1.5.5,datafusion=0.27.0
      - run: cargo build --workspace
      - name: Verify connection profiles through the installed SQLite driver
        run: cargo test -p grainlift-server --test connection_profiles -- --ignored
      - name: Quality and real-driver tests
        env:
          GRAINLIFT_SERVER: ${{ github.workspace }}/target/debug/grainlift-server
          GRAINLIFT_DRIVER: ${{ github.workspace }}/target/debug/libadbc_driver_grainlift.so
        run: ./validation/run_e2e.sh all -n auto --junitxml=e2e-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: downstream-e2e-results
          path: e2e-results.xml
          if-no-files-found: warn

  synthetic-worker-conformance:
    name: Shared worker conformance (Rust synthetic worker)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - run: cargo build --locked -p adbc-driver-grainlift -p grainlift-synthetic-worker
      - name: Verify HTTP and mTLS through the native ADBC driver
        run: |
          bash validation/diagnostics/make_test_tls.sh "$RUNNER_TEMP/grainlift-synthetic-tls"
          for transport in http mtls; do
            uv run --no-project --python 3.13 \
              --with pytest==9.1.1 --with pyarrow==25.0.1 \
              --with adbc-driver-manager==1.12.0 --with cryptography==50.0.1 \
              python -m pytest validation/conformance -q \
              --native-driver "$PWD/target/debug/libadbc_driver_grainlift.so" \
              --worker-command "[\"$PWD/target/debug/grainlift-synthetic-worker\"]" \
              --worker-transport "$transport" \
              --worker-tls-dir "$RUNNER_TEMP/grainlift-synthetic-tls"
          done

  external-validation:
    name: External ADBC validation (${{ matrix.backend }}, ${{ matrix.transport }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            driver: sqlite=1.12.0
            transport: http
          - backend: duckdb
            driver: duckdb=1.5.5
            transport: http
          - backend: postgresql
            driver: postgresql=1.12.0
            transport: http
          - backend: sqlite
            driver: sqlite=1.12.0
            transport: tcp
          - backend: sqlite
            driver: sqlite=1.12.0
            transport: mtls
          - backend: sqlite
            driver: sqlite=1.12.0
            transport: iroh
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADBC_POSTGRESQL_URI: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      GRAINLIFT_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.7
          enable-cache: true
      - run: uv python install 3.13
      - uses: columnar-tech/setup-dbc@ef4bdac93f5792831ebebe3fa2d848a040558caa # v1
        with:
          version: v0.3.0
          drivers: ${{ matrix.driver }}
      - run: cargo build --release --workspace
      - run: >-
          GRAINLIFT_SKIP_BUILD=1 ./validation/run_external.sh
          smoke ${{ matrix.backend }}
      - name: Concurrent proxy load smoke
        if: matrix.backend == 'sqlite' && matrix.transport == 'mtls'
        run: >-
          GRAINLIFT_SKIP_BUILD=1 ./validation/run_external.sh
          load sqlite --workers 8 --iterations 5 --warmup 1
          --rows 10000 --query-rows 512 --payload-bytes 32
      - name: Payload budget and HTTP fault smoke
        if: matrix.backend == 'sqlite' && matrix.transport == 'http'
        run: >-
          GRAINLIFT_SKIP_BUILD=1
          GRAINLIFT_VALIDATION_REQUEST_TIMEOUT_SECONDS=2
          ./validation/run_external.sh large-payload sqlite
          --response-budget-mib 2 --wire-faults --timeout-wait-seconds 3
      - name: Payload budget smoke
        if: matrix.backend == 'sqlite' && matrix.transport != 'http'
        run: >-
          GRAINLIFT_SKIP_BUILD=1 ./validation/run_external.sh
          large-payload sqlite --response-budget-mib 2
      - run: >-
          GRAINLIFT_SKIP_BUILD=1 ./validation/run_external.sh
          foundry ${{ matrix.backend }} -q
          --junitxml=validation/foundry-results.xml
      - name: Upload Foundry results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-results-${{ matrix.backend }}-${{ matrix.transport }}
          path: validation/foundry-results.xml
          if-no-files-found: ignore

  extended-backends:
    name: Extended ADBC backend compatibility
    needs: rust
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      flightsql:
        image: voltrondata/sqlflite:v1.5.5
        env:
          TLS_ENABLED: "0"
          SQLFLITE_PASSWORD: flight_password
        ports:
          - 31337:31337
      trino:
        image: trinodb/trino:483
        ports:
          - 18080:8080
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Adbc_Test_Pass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Adbc_Test_Pass123 -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
    env:
      GRAINLIFT_TRANSPORT: http
      ADBC_MYSQL_URI: mysql://root:root@127.0.0.1:3306/testdb
      ADBC_FLIGHTSQL_URI: grpc://127.0.0.1:31337
      ADBC_FLIGHTSQL_USERNAME: sqlflite_username
      ADBC_FLIGHTSQL_PASSWORD: flight_password
      ADBC_TRINO_URI: http://127.0.0.1:18080
      ADBC_TRINO_USERNAME: trino
      ADBC_MSSQL_URI: sqlserver://sa:Adbc_Test_Pass123@127.0.0.1:1433
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.7
          enable-cache: true
      - run: uv python install 3.13
      - uses: columnar-tech/setup-dbc@ef4bdac93f5792831ebebe3fa2d848a040558caa # v1
        with:
          version: v0.3.0
          drivers: mysql=0.4.0,flightsql=1.9.0,datafusion=0.25.0,trino=0.4.0,mssql=1.4.1
      - run: cargo build --release --workspace
      - name: Wait for Flight SQL and Trino
        run: |
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/31337) >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/31337) >/dev/null 2>&1
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/v1/info | grep -q '"starting":false'; then
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:18080/v1/info | grep -q '"starting":false'
      - name: Run real-driver compatibility smoke
        run: |
          for backend in mysql flightsql datafusion trino mssql; do
            GRAINLIFT_SKIP_BUILD=1 ./validation/run_external.sh smoke "$backend"
          done
