repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e05c5c0818279e5ac248ac9e954431ba58865e61
    hooks:
      - id: ruff-check
        args: ["--extend-select", "I", "--fix"]
        exclude: ^validation/(release_bundle\.py|profile_python_memory\.py|release_tests/)
      - id: ruff-format
        exclude: ^validation/(release_bundle\.py|profile_python_memory\.py|release_tests/)
      - id: ruff-check
        name: Ruff release validation
        files: ^validation/(release_bundle\.py|profile_python_memory\.py|release_tests/)
        args: ["--config", "validation/regression/pyproject.toml"]
      - id: ruff-format
        name: Ruff format release validation
        files: ^validation/(release_bundle\.py|profile_python_memory\.py|release_tests/)
        args: ["--check", "--config", "validation/regression/pyproject.toml"]

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
    hooks:
      - id: codespell
        # Generated Cargo logs include dependency names such as `inout`.
        exclude: "Cargo\\.(toml|lock)$|^validation/load-results/ec2-python-latency-20260926/rust-(test|clippy)\\.txt$"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: check-added-large-files
        args: ["--enforce-all"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        # Preserve original JUnit, profiler and diagnostic-log payloads byte-for-byte.
        exclude: ^validation/(release-results/candidate-[^/]+/.*\.xml|load-results/[^/]+/.*\.speedscope\.json|load-results/(ec2-python-latency-20260926|ec2-matched-synthetic-20260926|ec2-transport-comparison-20260926)/.*\.txt)$
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        # Preserve unified-diff context and generated JUnit failure text.
        exclude: ^validation/(hardening/grainlift-python\.patch|diagnostics/.*\.patch|load-results/[^/]+/.*\.patch\.txt|release-results/candidate-[^/]+/.*\.xml)$

  - repo: https://github.com/adbc-drivers/dev
    rev: ffdbb1a1237b89cafb15a7420667f54838986681
    hooks:
      - id: rat

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        types: [rust]
        entry: bash -c 'cargo +stable fmt --all'
        pass_filenames: false
